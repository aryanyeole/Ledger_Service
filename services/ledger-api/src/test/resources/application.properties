# Layered over src/main/resources/application.yml: at the same location .properties wins over .yml
# for the same key, and main has no application.properties for this file to shadow (D-096).
# No test context runs the outbox relay or contacts a broker unless the test class sets
# ledger.outbox.relay.enabled=true in @SpringBootTest(properties): the relay's conditions are
# evaluated before any DynamicPropertyRegistrar runs, so the off switch has to live here.
ledger.outbox.relay.enabled=false
ledger.outbox.relay.scheduled=false
# Same for the idempotency key purge (D-126): no test context purges unless the test class sets
# ledger.idempotency.purge.enabled=true; tests call purgeExpired() directly.
ledger.idempotency.purge.enabled=false
ledger.idempotency.purge.scheduled=false
