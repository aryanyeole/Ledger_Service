# pgjdbc's classpath defaults (D-132): the lowest-priority connection properties, under the JDBC
# URL's parameters and the Properties a DataSource passes, so they reach every pgjdbc connection in
# this JVM: Flyway's derived SimpleDriverDataSource (server and migrate-only mode) and the Hikari
# pool alike, whatever SPRING_DATASOURCE_URL says.
#
# loginTimeout bounds establishing a connection (TCP, SSL negotiation, startup, authentication).
# pgjdbc's default is 0, unbounded, and pgjdbc 42.7.13 ignores the DriverManager login timeout
# Hikari sets, so a database that accepts TCP but doesn't answer hung startup forever (BUG-012).
# On a startup connection a timeout fails the context and the process exits 1 (D-083).
loginTimeout=10
