spring:
  application:
    name: ledger-api
  datasource:
    # Host default; containers override with SPRING_DATASOURCE_URL (D-030).
    url: jdbc:postgresql://localhost:5433/ledger
    # Runtime role: not the schema owner (D-006). Roles come from infra/postgres/init.
    username: ledger_api_app
    password: ${LEDGER_API_APP_PASSWORD}
  flyway:
    enabled: true
    # Migrations run as the owner on their own connection.
    user: ledger_api_owner
    password: ${LEDGER_API_OWNER_PASSWORD}
    locations: classpath:db/migration
  jackson:
    # JSON field names follow spec §7: account_id, as_of, created_at.
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health
