spring:
  application:
    name: ledger-api
  datasource:
    # Host default; containers override with SPRING_DATASOURCE_URL (D-030).
    url: jdbc:postgresql://localhost:5433/ledger
    username: ${POSTGRES_USER:ledger}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health
