spring:
  application:
    name: ledger-api
  datasource:
    # Host default; containers override with SPRING_DATASOURCE_URL (D-030).
    url: jdbc:postgresql://localhost:5433/ledger
    # Runtime role: not the schema owner (D-006). Roles come from infra/postgres/init.
    username: ledger_api_app
    password: ${LEDGER_API_APP_PASSWORD}
  flyway:
    enabled: true
    # Migrations run as the owner on their own connection.
    user: ledger_api_owner
    password: ${LEDGER_API_OWNER_PASSWORD}
    locations: classpath:db/migration
  jackson:
    # JSON field names follow spec §7: account_id, as_of, created_at.
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Unknown JSON fields are a 400 invalid_request, never silently ignored (D-046).
      fail-on-unknown-properties: true
  autoconfigure:
    # The outbox relay owns the only Kafka client (D-098): no default template or factories.
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  task:
    scheduling:
      pool:
        # The relay (200 ms) and the idempotency key purge (5 min, runs until a short batch) each
        # get a thread, so a long purge run can't hold up the relay's ticks (D-127).
        size: 2

ledger:
  outbox:
    relay:
      # Tests turn both off in src/test/resources/application.properties (D-096).
      enabled: true
      scheduled: true
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  idempotency:
    purge:
      # Tests turn both off in src/test/resources/application.properties (D-096, D-126);
      # batch-size (1000) and interval (5m) keep their defaults.
      enabled: true
      scheduled: true

management:
  endpoints:
    web:
      exposure:
        include: health
