name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR runs are cancelled; every push to main runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No paths: filters. Both jobs are required checks, and a skipped required check blocks merging.
jobs:
  ledger-api:
    name: ledger-api
    # Pinned image (D-070): concurrency proofs are timing-sensitive; upgrades are explicit PRs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ledger-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  settlement-worker:
    name: settlement-worker
    # Pinned image (D-070): concurrency proofs are timing-sensitive; upgrades are explicit PRs.
    runs-on: ubuntu-24.04
    # Measured runtime plus 50 % (D-089): 2m12s on PR #36's first run (warm caches) x 1.5, rounded up.
    timeout-minutes: 4
    defaults:
      run:
        working-directory: services/settlement-worker
    steps:
      - uses: actions/checkout@v7
      # The worker's tests build their schema with the ledger-api jar in migrate-only mode (D-083).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/ledger-api/pom.xml
      - run: ./mvnw -B -q -DskipTests package
        working-directory: services/ledger-api
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/settlement-worker/constraints.txt
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: pytest
        env:
          # The crash test's CI size (D-085): a regression gate; only the local soak's numbers are published (D-105).
          CRASH_ITERATIONS: "5"
